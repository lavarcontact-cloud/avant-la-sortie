[project]
name = "scf-agent"
version = "0.1.0"
description = "SNAP CLIP FACTORY — agent desktop (Windows / macOS)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "keyring>=25"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "sqlalchemy>=2.0", "pyjwt>=2.8"]

[project.scripts]
scf-agent = "scf_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scf_agent"]
