# Génération du projet Xcode : `brew install xcodegen && xcodegen generate`
# puis ouvrir SnapClipMobile.xcodeproj, choisir ton équipe de signature
# (DEVELOPMENT_TEAM) et lancer sur l'iPhone réel.
name: SnapClipMobile
options:
  bundleIdPrefix: com.snapclipfactory
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""          # à renseigner
    CODE_SIGN_STYLE: Automatic
targets:
  SnapClipMobile:
    type: application
    platform: iOS
    sources: [SnapClipMobile, Shared]
    info:
      path: SnapClipMobile/Info.plist
      properties:
        CFBundleDisplayName: Snap Clip
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: >-
          Snap Clip lit tes vidéos pour les copier vers ton ordinateur. Les originaux
          ne sont jamais modifiés ni supprimés.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.snapclipfactory.mobile.refresh
          - com.snapclipfactory.mobile.sync
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # serveur de dev sur le réseau local ; HTTPS ailleurs
    entitlements:
      path: SnapClipMobile/SnapClipMobile.entitlements
      properties:
        com.apple.security.application-groups: [group.com.snapclipfactory.mobile]
    dependencies:
      - target: SnapClipShare
  SnapClipShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Snap Clip
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    entitlements:
      path: ShareExtension/SnapClipShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.snapclipfactory.mobile]
