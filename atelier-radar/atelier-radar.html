<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: instrument panel — fixed index rail (pages 01–09) on desktop, bottom tab bar on phone; dossiers read like a technical spec sheet. */
:root{
  --bg:#ECEDEA; --panel:#F8F8F6; --sunk:#E2E4E0; --ink:#15171A; --muted:#5B6166; --line:#D1D4CE;
  --accent:#2152C4; --accent-ink:#FFFFFF; --accent-soft:#DCE5F8;
  --good:#1E7A4C; --good-soft:#D8EFE2; --warn:#A66300; --warn-soft:#F6E7CC; --bad:#B0322A; --bad-soft:#F5DAD7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --panel:#191C1F; --sunk:#0C0E10; --ink:#E8E9E5; --muted:#9AA0A5; --line:#2C3035;
  --accent:#86A6FF; --accent-ink:#0B1020; --accent-soft:#1D2742;
  --good:#5CC48D; --good-soft:#15291F; --warn:#E3A84A; --warn-soft:#2E2414; --bad:#EE7C72; --bad-soft:#341A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --panel:#191C1F; --sunk:#0C0E10; --ink:#E8E9E5; --muted:#9AA0A5; --line:#2C3035;
  --accent:#86A6FF; --accent-ink:#0B1020; --accent-soft:#1D2742;
  --good:#5CC48D; --good-soft:#15291F; --warn:#E3A84A; --warn-soft:#2E2414; --bad:#EE7C72; --bad-soft:#341A18; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;background:var(--panel)}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;padding:8px 8px;border-radius:var(--r);text-decoration:none;color:var(--ink)}
.nav a .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav a[aria-current="page"] .n{color:var(--accent)}
.nav a:hover{background:var(--sunk)}
.badge{font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.rail-foot{margin-top:auto;padding:0 6px;display:flex;flex-direction:column;gap:4px}

main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.wrap>*{min-width:0;max-width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head .t{display:flex;flex-direction:column;gap:4px;min-width:0}

.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;text-decoration:none;color:var(--muted);background:none;border:0;font-size:.7rem;cursor:pointer}
  .tabbar .n{font-family:var(--f-mono);font-size:.68rem}
  .tabbar [aria-current="page"]{color:var(--accent)}
  h1{font-size:1.4rem}
}
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet .nav a{padding:12px 8px}
.scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.35)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2,.panel>.ph{margin-bottom:12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:.78rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-family:var(--f-mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:inherit;cursor:pointer}
.card:hover{border-color:var(--muted)}
.score{width:64px;height:64px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sunk);border:1px solid var(--line)}
.score b{font-family:var(--f-display);font-size:1.5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.score.hi{background:var(--good-soft);border-color:transparent}.score.hi b{color:var(--good)}
.score.mid{background:var(--warn-soft);border-color:transparent}.score.mid b{color:var(--warn)}
.score.lo b{color:var(--muted)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin-top:4px}
.card .meta .mono{color:var(--ink)}
.card h3{font-size:1rem}

.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=email],input[type=tel],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}

.spec{display:grid;grid-template-columns:minmax(120px,38%) minmax(0,1fr);border-top:1px solid var(--line)}
.spec>div{padding:7px 0;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.spec>div:nth-child(odd){color:var(--muted);font-size:.86rem;padding-right:10px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-top:2px solid var(--ink)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:4px 10px;align-items:center;font-size:.85rem}
.bar .track{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .num{text-align:right;font-family:var(--f-mono)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.note{border-left:3px solid var(--line);padding:8px 12px;background:var(--sunk);border-radius:0 var(--r) var(--r) 0;font-size:.88rem}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.good{border-color:var(--good);background:var(--good-soft)}
.note.acc{border-color:var(--accent);background:var(--accent-soft)}

.doc{white-space:pre-wrap;font-size:.92rem;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-width:72ch;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.ev .d{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.ev>span{min-width:0;overflow-wrap:anywhere}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r);font-size:.88rem;max-width:min(92vw,520px)}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lane .mini{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:.86rem;cursor:pointer}
.dl{display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  <aside class="rail" aria-label="Navigation">
    <div class="brand"><span class="eyebrow">Recherche de local</span><b>ATELIER RADAR</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot small muted" id="railFoot">Connexion à la base…</div>
  </aside>
  <main id="main"><div class="wrap"><div class="empty">Chargement de la base Atelier Radar…</div></div></main>
</div>

<script>
"use strict";
/* ===================== Configuration ===================== */
const PAGES = [
  {id:"dashboard", n:"01", label:"Dashboard"},
  {id:"recherche", n:"02", label:"Recherche"},
  {id:"dossiers", n:"03", label:"Dossiers"},
  {id:"candidatures", n:"04", label:"Candidatures"},
  {id:"profil", n:"05", label:"Profil candidat"},
  {id:"negociation", n:"06", label:"Négociation"},
  {id:"comptes", n:"07", label:"Comptes & connecteurs"},
  {id:"journal", n:"08", label:"Journal"},
  {id:"parametres", n:"09", label:"Paramètres"}
];
const TABS = ["dashboard","recherche","candidatures","profil"];
const DEFAULT_SETTINGS = {
  budget:{idealMin:500, ideal:700, plafond:800, inclureFonctionnement:false},
  surface:{min:30, max:60, idealMin:40, idealMax:50},
  estimations:{chargesM2An:30, tfM2An:10, elec:45, chauffage:0, internet:30, assurance:25, depotMois:3},
  styleBonus:{loft:5, atelier_americain:5, garage:4, industriel:4, verriere:3, mezzanine:2, grande_hauteur:2},
  zones:{
    proche:["Champigny-sur-Marne","Chennevières-sur-Marne","Le Plessis-Trévise","Villiers-sur-Marne","Bry-sur-Marne","Ormesson-sur-Marne","La Queue-en-Brie","Noiseau"],
    secondaire:["Saint-Maur-des-Fossés","Joinville-le-Pont"],
    paris:["Paris"],
    c1:["Saint-Ouen","Saint-Ouen-sur-Seine","Saint-Denis","Aubervilliers","Pantin","Montreuil","Bagnolet","Ivry-sur-Seine","Clichy","Les Lilas","Le Pré-Saint-Gervais","Saint-Mandé","Vitry-sur-Seine","Vincennes","Gentilly","Le Kremlin-Bicêtre","Malakoff","Montrouge","Charenton-le-Pont","Romainville","Noisy-le-Sec","La Courneuve"],
    c2:["Nogent-sur-Marne","Rosny-sous-Bois","Fontenay-sous-Bois","Sucy-en-Brie","Bonneuil-sur-Marne","Créteil","Le Perreux-sur-Marne"]
  },
  veille:{requetes:[
    "location local d'activité OR atelier OR local commercial Champigny-sur-Marne 30 à 60 m²",
    "location local professionnel OR atelier OR garage Chennevières-sur-Marne OR \"Le Plessis-Trévise\" OR Villiers-sur-Marne OR Bry-sur-Marne",
    "location local OR atelier OR bureau Ormesson-sur-Marne OR \"La Queue-en-Brie\" OR Noiseau",
    "site:leboncoin.fr bureaux_commerces Champigny-sur-Marne OR Chennevières OR \"Plessis-Trévise\" OR Villiers-sur-Marne",
    "location local d'activité OR atelier Saint-Maur-des-Fossés OR Joinville-le-Pont moins de 800 €",
    "site:pap.fr location local Champigny-sur-Marne OR Saint-Maur OR Villiers-sur-Marne"
  ]},
  horaires:["08:30","13:00","20:30"]
};
const STATUTS_INFO = {confirme:"confirmé", declaratif:"déclaratif", estime:"estimé", inconnu:"inconnu", inclus:"inclus"};
const CAND = [
  ["a_preparer","À préparer"],["brouillon","Brouillon"],["prete","Prête"],["envoyee","Envoyée"],["en_attente","En attente"],
  ["relance","Relance à faire"],["visite","Visite"],["positive","Réponse positive"],["negative","Réponse négative"]
];
const CAND_LABEL = Object.fromEntries(CAND);
const TYPES = {studio:"Studio indépendant", loft:"Loft / atelier loft", atelier_artiste:"Atelier d'artiste", garage:"Ancien garage", local_activite:"Local d'activité", atelier_artisanal:"Atelier artisanal", entrepot:"Petit entrepôt / dépôt", usine:"Partie d'usine", commerce:"Ancien commerce / boutique", local_pro:"Local professionnel", showroom:"Showroom / espace de création", bureau:"Bureau", autre:"Autre / atypique"};
const STYLES = {loft:"Loft", atelier_americain:"Atelier américain", garage:"Garage", industriel:"Industriel", verriere:"Verrière", mezzanine:"Mezzanine", grande_hauteur:"Grande hauteur", lumiere:"Lumière naturelle", rdc:"Rez-de-chaussée", brique:"Brique", beton:"Béton", classique:"Classique fonctionnel"};
const AGENTS = {"01":"Prospecteur", "02":"Analyste", "03":"Candidature", "04":"Négociateur", "05":"Communication", "06":"Comptes & connecteurs", "07":"Directeur de projet"};
const COST_ITEMS = [
  ["loyerHT","Loyer hors taxes"],["charges","Charges"],["electricite","Électricité"],["chauffage","Chauffage"],
  ["internet","Internet"],["assurance","Assurance"],["taxeFonciere","Taxe foncière (mensualisée)"]
];

/* ===================== State ===================== */
const S = {
  db:null, user:null, sample:null, mcp:null,
  offres:new Map(), profil:null, comptes:[], connecteurs:[], journal:[], settings:null, status:null,
  ready:{offres:false, profil:false}, offline:false, canWrite:true,
  view:"dashboard", param:null, tab:{}, editing:false, pending:false,
  filters:{q:"", zone:"", budget:"", surfMin:"", surfMax:"", style:"", type:"", etat:"", qualif:"", scoreMin:"", source:"", tri:"classement"},
  gen:{}, veille:{running:false, log:[]}
};

/* ===================== Utils ===================== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = v => (v==null || isNaN(v)) ? "—" : new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v);
const num = v => (v===""||v==null||isNaN(Number(v))) ? null : Number(v);
const nowIso = () => new Date().toISOString();
const today = () => new Date().toISOString().slice(0,10);
const fdate = d => { if(!d) return "—"; const x = new Date(d); return isNaN(x) ? esc(d) : x.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}); };
const fdt = d => { if(!d) return "—"; const x = new Date(d); return isNaN(x) ? esc(d) : x.toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
const daysSince = d => d ? Math.floor((Date.now() - new Date(d).getTime())/86400000) : null;
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const getPath = (o,p) => p.split(".").reduce((a,k)=> a==null?undefined:a[k], o);
const setPath = (o,p,v) => { const ks=p.split("."); let c=o; ks.slice(0,-1).forEach(k=>{ if(c[k]==null||typeof c[k]!=="object") c[k]={}; c=c[k]; }); c[ks[ks.length-1]]=v; };
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lines = t => String(t||"").split("\n").map(s=>s.trim()).filter(Boolean);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 3200); }
async function copy(text, btn){
  try{ await navigator.clipboard.writeText(text); toast("Copié dans le presse-papiers"); }
  catch(e){ const pre = btn?.closest("[data-copybox]")?.querySelector(".doc"); if(pre){ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné : copie-le manuellement"); } else toast("Copie impossible ici"); }
}
const settings = () => Object.assign({}, DEFAULT_SETTINGS, S.settings||{}, {
  budget:Object.assign({}, DEFAULT_SETTINGS.budget, S.settings?.budget||{}),
  surface:Object.assign({}, DEFAULT_SETTINGS.surface, S.settings?.surface||{}),
  estimations:Object.assign({}, DEFAULT_SETTINGS.estimations, S.settings?.estimations||{}),
  zones:Object.assign({}, DEFAULT_SETTINGS.zones, S.settings?.zones||{}),
  veille:Object.assign({}, DEFAULT_SETTINGS.veille, S.settings?.veille||{})
});

/* ===================== Analyste : coûts ===================== */
function item(o,k){ const c=o.couts?.[k]; return c && typeof c==="object" ? c : {v:null, s:"inconnu"}; }
function surfaceOf(o){ return num(o.surface?.retenue) ?? num(o.surface?.min) ?? null; }
const FONCT = ["electricite","chauffage","internet","assurance"];
/* Coût locatif = loyer + TVA + charges + taxe foncière (ce que facture le bailleur).
   Frais de fonctionnement = électricité, chauffage, internet, assurance (estimés si inconnus).
   min = uniquement ce qui est écrit (TVA 0 si non précisée) ; max = avec estimations et TVA 20 % si non précisée. */
function computeCosts(o){
  const st = settings(), E = st.estimations, surf = surfaceOf(o) || 40;
  const loyer = item(o,"loyerHT"), tva = item(o,"tva");
  const tvaKnown = tva.s!=="inconnu";
  const tMin = tvaKnown ? (num(tva.v)||0) : 0, tMax = tvaKnown ? (num(tva.v)||0) : 0.2;
  const L = num(loyer.v);
  const est = {charges:E.chargesM2An*surf/12, taxeFonciere:E.tfM2An*surf/12, electricite:E.elec, chauffage:E.chauffage, internet:E.internet, assurance:E.assurance};

  rows.push({k:"loyerHT", label:"Loyer hors taxes", v:L, s:L==null?"inconnu":loyer.s, g:"loc"});
  rows.push({k:"tva", label: tvaKnown ? `TVA (${Math.round((num(tva.v)||0)*100)} %)` : "TVA (non précisée : 0 à 20 %)", v: L==null?null:L*tMax, vmin:L==null?null:L*tMin, s:tva.s, g:"loc"});
  if(L!=null) rows.push({k:"loyerTTC", label:"Loyer TTC", v:L*(1+tMax), vmin:L*(1+tMin), s: tvaKnown ? loyer.s : "estime", g:"loc"});

    const tax = (k==="charges") ? 1 : 0;
    const vMin = known ? v*(1+tax*tMin) : 0, vMax = v*(1+tax*tMax);
    rows.push({k,label,v:vMax,vmin: known ? vMin : null,s,g});
    if(g==="loc"){ locMin += vMin; locMax += vMax; } else { foncMin += known ? v : 0; foncMax += vMax; }
    if(s==="confirme") confirmed += vMax; else estimated += vMax;
  }
  const depot = item(o,"depot"), hono = item(o,"honoraires"), entree = item(o,"fraisEntree");
  let depotV = num(depot.v), depotS = depot.s; if(depotV==null && L!=null){ depotV = L*E.depotMois; depotS="estime"; }
  const unk = L==null;
  const init = [
    {label:"Dépôt de garantie", v:depotV, s:depotV==null?"inconnu":depotS},
    {label:"Honoraires", v:num(hono.v), s:hono.s},
    {label:"Frais d'entrée", v:num(entree.v), s:entree.s},
    {label:"Premier mois (estimation haute)", v:unk?null:locMax+foncMax, s:"estime"}

  const initialIncomplete = init.some(r=> r.v==null && r.s==="inconnu");

}

const weightS = s => s==="confirme"?1 : s==="declaratif"?0.6 : 0;
function computeScore(o){

  const elim = [], aVerifier = [], notes = [];
  const prive = o.prive?.valeur, ps = o.prive?.statut;
  let p1 = prive==="oui" ? (ps==="confirme"?25: ps==="declaratif"?16:10) : prive==="non" ? 0 : 6;
  if(prive==="non") elim.push("Pas de jouissance exclusive (espace partagé)");

  let p2 = 0;
  if(bb.max==null) aVerifier.push("Loyer inconnu");

    const m = bb.max;

    if(bb.min > b.plafond && !o.budgetDerogation) elim.push(`Coût au-delà de ${eur(b.plafond)} TTC/mois (au moins ${eur(bb.min)})`);
    else if(m > b.plafond){ p2 = 4; aVerifier.push(`Budget à confirmer : ${eur(bb.min)} à ${eur(m)} selon TVA et charges`); }

  if(s==null || ss==="inconnu") aVerifier.push("Surface exacte inconnue");
  else {
    const tol = 2;

    if(ss==="declaratif") p3 = Math.round(p3*0.85);
    if(o.surface?.min!=null && o.surface?.max!=null && o.surface.min!==o.surface.max) aVerifier.push("Lot exact à préciser (surface variable)");
    if(s < sf.min-tol || s > sf.max+tol) elim.push(`Surface hors critères (${s} m²)`);
  }
  const z = zoneOf(o);

  let p4 = z==="proche" ? 9 : z==="secondaire" ? 7 : z==="paris"||z==="c1" ? 3 : z==="c2" ? 3 : 0;
  if(z==="paris"||z==="c1") notes.push("Hors secteur prioritaire (Champigny et voisines)");
  if(z==="hors") elim.push("Hors Paris et petite couronne");
  if(z==="c2" && !o.exceptionnel) elim.push("Hors secteur, sans caractère exceptionnel");
  if(z==="inconnu") aVerifier.push("Commune à préciser");
  const tm = num(o.transports?.minutesPied), tsv = o.transports?.statut;
  if(tm!=null && tsv!=="inconnu") p4 += tm<=5?6 : tm<=10?5 : tm<=15?3 : 1;
  else if(o.transports?.texte && tsv && tsv!=="inconnu") p4 += 2;
  else notes.push("Temps à pied vers les transports inconnu");
  const cf = o.config||{}; let p5 = 0;
  const feat = (f, pts) => { const x = cf[f]; if(x && x.v) p5 += pts*weightS(x.s); };
  feat("rdc",2); feat("accesRue",2); feat("acces24h",2); feat("securise",1);
  const h = num(cf.hauteur?.v); if(h!=null && h>=3) p5 += 2*weightS(cf.hauteur.s);
  const styl = (o.styles||[]).filter(x=>["loft","atelier_americain","garage","industriel","verriere","mezzanine","lumiere","brique","beton"].includes(x)).length;
  p5 += Math.min(2, styl) * (o.stylesStatut==="confirme"?1:0.5);
  p5 = Math.min(10, Math.round(p5*10)/10);
  const us = o.usage||{};
  const p6 = us.compatible==="oui" ? (us.statut==="confirme"?10:5) : 0;
  if(us.compatible==="non") elim.push("Activité audiovisuelle non autorisée");
  if(!(us.compatible==="oui" && us.statut==="confirme")) aVerifier.push("Autorisation de tournage à confirmer");
  const eb = o.etatBien||{}, EB = {bon:5, renove:5, a_rafraichir:2, travaux:1};
  const p7 = EB[eb.v]!=null ? Math.round(EB[eb.v]*(eb.s==="confirme"?1: eb.s==="declaratif"?0.6:0)) : 0;
  if(!eb.v) notes.push("État du local à constater en visite");
  if(verifOf(o)==="consultee") aVerifier.push("Disponibilité supposée : annonce seulement consultée");
  const parts = [
    {k:"exclusivite", label:"Exclusivité et jouissance privative", pts:p1, max:25},
    {k:"prix", label:"Prix total", pts:p2, max:20},
    {k:"surface", label:"Surface", pts:p3, max:15},
    {k:"localisation", label:"Localisation et transports", pts:p4, max:15},
    {k:"config", label:"Configuration et esthétique", pts:p5, max:10},
    {k:"audiovisuel", label:"Autorisation d'activité audiovisuelle", pts:p6, max:10},
    {k:"etat", label:"État et aménagement", pts:p7, max:5}

  const bonusMap = st.styleBonus || DEFAULT_SETTINGS.styleBonus;

  return {total, parts, elim, aVerifier, notes, bonus, rank: total + bonus, qualif, costs:c, budget:bb};
}

function normUrl(u){ try{ const x=new URL(u); return (x.hostname.replace(/^www\./,"")+x.pathname).replace(/\/$/,"").toLowerCase(); }catch(e){ return String(u||"").toLowerCase(); } }
function duplicatesOf(o){
  const out = [], mine = (o.sources||[]).map(s=>normUrl(s.url)), refs = (o.sources||[]).map(s=>s.ref).filter(Boolean);
  const s1 = surfaceOf(o), l1 = num(o.couts?.loyerHT?.v), v1 = (o.ville||"").toLowerCase(), a1 = (o.adresse||"").toLowerCase();
  for(const p of S.offres.values()){
    if(p.id===o.id || p.doublonDe===o.id || o.doublonDe===p.id || p.doublonDe) continue;
    let why = null;
    if((p.sources||[]).some(s=> mine.includes(normUrl(s.url)))) why = "même lien d'annonce";
    else if((p.sources||[]).some(s=> s.ref && refs.includes(s.ref))) why = "même référence";
    else {
      const s2 = surfaceOf(p), l2 = num(p.couts?.loyerHT?.v), v2 = (p.ville||"").toLowerCase(), a2 = (p.adresse||"").toLowerCase();
      const sameCity = v1 && v2 && (v1===v2 || v1.split(" ")[0]===v2.split(" ")[0]);
      const sameAddr = a1 && a2 && a1.length>6 && a1===a2;
      const closeSurf = s1!=null && s2!=null && Math.abs(s1-s2)<=2;
      const closePrice = l1!=null && l2!=null && Math.abs(l1-l2) <= Math.max(l1,l2)*0.05;
      if(sameAddr && closeSurf) why = "même adresse et surface";
      else if(sameCity && closeSurf && closePrice) why = "même ville, surface et prix proches";
    }
    if(why) out.push({id:p.id, titre:p.titre, why});
  }
  return out;
}

/* ===================== DB ===================== */
async function saveOffer(o, journalMsg, agent){
  if(!S.db) return toast("Base indisponible : modification non enregistrée");
  const d = clone(o); d.updatedAt = nowIso();
  const sc = computeScore(d); d.scoreCache = {total:sc.total, rank:sc.rank, qualif:sc.qualif, coutMensuelMax: sc.costs.max==null?null:Math.round(sc.costs.max), calcule: nowIso()};
  try{ await S.db.collection("offres").doc(d.id).set(d); if(journalMsg) await log(agent||"07", journalMsg, d.id, "ok"); return true; }
  catch(e){ toast(e.code==="invalid_argument" ? "Écriture refusée : accès en lecture seule" : "Échec de l'enregistrement (" + (e.code||"erreur") + ")"); return false; }
}
async function log(agent, action, ref, resultat, source){
  if(!S.db) return;
  try{ await S.db.collection("journal").add({date: nowIso(), agent, action, ref: ref||null, resultat: resultat||"ok", source: source||"application"}); }catch(e){}
}

function applyFilters(arr){
  const f = S.filters;
  return arr.filter(({o,sc})=>{
    if(o.doublonDe) return false;
    if(f.q && !(`${o.titre} ${o.ville} ${o.description} ${o.adresse}`.toLowerCase().includes(f.q.toLowerCase()))) return false;
    if(f.zone && zoneOf(o)!==f.zone) return false;
    if(f.budget && (sc.costs.max==null || sc.costs.max>num(f.budget))) return false;
    if(f.surfMin && (surfaceOf(o)==null || surfaceOf(o)<num(f.surfMin))) return false;
    if(f.surfMax && (surfaceOf(o)==null || surfaceOf(o)>num(f.surfMax))) return false;
    if(f.style && !(o.styles||[]).includes(f.style)) return false;
    if(f.type && o.type!==f.type) return false;
    if(f.etat && (o.etatAnnonce||"a_reverifier")!==f.etat) return false;
    if(f.qualif && sc.qualif!==f.qualif) return false;
    if(f.scoreMin && sc.total<num(f.scoreMin)) return false;
    if(f.source && !(o.sources||[]).some(s=>(s.site||"").toLowerCase()===f.source.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>{
    if(f.tri==="cout") return (a.sc.costs.max??1e9)-(b.sc.costs.max??1e9);
    if(f.tri==="verif") return String(b.o.dateVerif||"").localeCompare(String(a.o.dateVerif||""));
    if(f.tri==="score") return b.sc.total-a.sc.total;
    return byRank(a,b);
  });
}

const SECTION_LABELS = {presentation:"1. Présentation personnalisée", mail:"2. Mail de candidature", activite:"3. Activité exercée", entretien:"4. Utilisation et entretien du lieu", arguments:"5. Arguments qui rassurent", negocier:"6. Points à négocier", documents:"7. Justificatifs utiles", relance:"8. Stratégie de relance", alternative:"9. Stratégie alternative"};
function tabCandidature(o, sc){
  const cand = o.candidature||{}, d = cand.draft, cs = contactState(o);
  const statusSel = `<select id="candStatut" data-act-change="candStatut" data-id="${esc(o.id)}">${CAND.map(([k,l])=>`<option value="${k}" ${(cand.statut||"a_preparer")===k?"selected":""}>${l}</option>`).join("")}</select>`;
  const warn = cs.uncertain ? `<div class="note bad">Un envoi est enregistré comme <b>non vérifié</b>. Aucune relance tant que l'historique n'est pas confirmé.</div>` : cs.verified ? `<div class="note acc">Premier contact vérifié le ${fdate(cs.lastSent?.date)}. ${cs.canRelance?"Une relance est appropriée.":"Relance pas encore appropriée."}</div>` : `<div class="note">Aucun contact enregistré pour ce local. Vérifie l'historique de tes mails avant d'envoyer (Gmail et Hotmail ne sont pas encore lisibles par l'application).</div>`;
  return `<div class="stack">
  <section class="panel"><div class="ph"><h2>Suivi de candidature</h2><div class="row"><label class="f" style="min-width:200px">Statut ${statusSel}</label></div></div>
    <div class="spec"><div>Profil envoyé</div><div>${cand.profilEnvoye?"oui":"non"}</div><div>Premier contact</div><div>${cand.premierContact?fdate(cand.premierContact):"aucun"}</div><div>Canal</div><div>${esc(cand.canal||"—")}</div><div>Documents transmis</div><div>${esc((cand.documents||[]).join(", ")||"aucun")}</div><div>Réponse reçue</div><div>${esc(cand.reponse||"—")}</div><div>Prochaine relance</div><div>${cand.prochaineRelance?fdate(cand.prochaineRelance):"—"}</div></div>
    ${warn}
    <div class="row" style="margin-top:10px">
      <button class="btn primary" data-act="genCand" data-id="${esc(o.id)}">${d?"Régénérer depuis le profil":"Générer la candidature"}</button>
      ${d?`<button class="btn" data-act="refineCand" data-id="${esc(o.id)}">Affiner le mail avec Claude</button>`:""}
      <button class="btn" data-act="markSent" data-id="${esc(o.id)}">J'ai envoyé ce message</button>
    </div>
    <p class="small muted" style="margin:8px 0 0">L'application n'envoie rien à ta place : copie le mail, envoie-le toi-même, puis enregistre l'envoi ici.</p>
    ${S.gen[o.id]?`<div class="note acc" style="margin-top:10px">${esc(S.gen[o.id])}</div>`:""}
  </section>
  ${d?Object.entries(SECTION_LABELS).map(([k,l])=>`<section class="panel" data-copybox><div class="ph"><h3>${l}</h3><button class="btn ghost" data-act="copySec" data-id="${esc(o.id)}" data-k="${k}">Copier</button></div><div class="doc">${esc(d.sections?.[k]||"")}</div></section>`).join("") + `<p class="small muted">Généré le ${fdt(d.generatedAt)} · ${esc(d.auteur||"")}</p>` : `<div class="empty">Pas encore de candidature pour ce local. Elle est générée à partir de ton profil et des caractéristiques de l'annonce.</div>`}
  </div>`;
}

function tabHistorique(o){

  return `<div class="grid g2">
  <section class="panel"><div class="ph"><h2>Historique</h2><span class="eyebrow">${h.length}</span></div>
    ${h.length?`<div class="timeline">${h.map(e=>`<div class="ev"><span class="d">${fdate(e.date)}</span><span><b>${esc(TYPESH[e.type]||e.type)}</b>${e.canal?` · ${esc(e.canal)}`:""}${e.type==="message_envoye"?(e.verifie?' <span class="pill good">vérifié</span>':' <span class="pill bad">envoi non vérifié</span>'):""}<br>${esc(e.resume||"")}</span></div>`).join("")}</div>`:`<div class="empty">Aucun échange connu. Les mails ne sont pas encore importés (Gmail à reconnecter, Hotmail non connecté).</div>`}

      <label class="f">Date<input type="date" id="h-date" data-k="date" value="${today()}"></label>
      <label class="f">Canal<select id="h-canal" data-k="canal"><option value="">—</option><option>Mail Gmail</option><option>Mail Hotmail</option><option>Leboncoin</option><option>Téléphone</option><option>Formulaire site</option><option>SMS / WhatsApp</option><option>Sur place</option></select></label>
    </div>
    <label class="check"><input type="checkbox" id="h-verifie" data-k="verifie"> Envoi vérifié (je vois le message dans mes éléments envoyés)</label>

    <label class="f">Prochaine action<input type="text" id="h-next" data-k="next" placeholder="Ex. rappeler jeudi"></label>

    <div class="row"><button class="btn primary" type="submit">Ajouter</button></div>
  </form></div>`;
}

function readForm(form, base){
  const d = clone(base) || {};
  form.querySelectorAll("[data-k]").forEach(el=>{
    let v;
    if(el.type==="checkbox") v = el.checked;
    else if(el.hasAttribute("data-lines")) v = lines(el.value);
    else if(el.type==="number") v = el.value==="" ? null : Number(el.value);
    else v = el.value;
    const k = el.dataset.k;
    if(k.startsWith("sources.0.")){ d.sources = d.sources && d.sources.length ? d.sources : [{}]; }
    setPath(d, k, v);
  });
  return d;
}
document.addEventListener("submit", async e=>{
  const f = e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  const kind = f.dataset.form, id = f.dataset.id;
  if(kind==="offre"){
    const o = S.offres.get(id); const d = readForm(f, o);
    d.styles = [...f.querySelectorAll("[data-style]")].filter(x=>x.checked).map(x=>x.dataset.style);
    if(d.couts?.loyerHT?.v!=null && num(o.couts?.loyerHT?.v)!=null && num(d.couts.loyerHT.v)!==num(o.couts.loyerHT.v)){ d.prixHistorique = [...(o.prixHistorique||[{date:o.dateVerif||today(), v:num(o.couts.loyerHT.v)}]), {date:today(), v:num(d.couts.loyerHT.v)}]; }
    S.editing=false; if(await saveOffer(d, "Dossier modifié, score recalculé", "02")) toast("Enregistré · score " + computeScore(d).total + "/100");
  }
  if(kind==="nego"){
    const o = S.offres.get(id); const n = readForm(f, Object.assign(defaultNego(o), o.negociation||{}));
    const d = clone(o); d.negociation = n; if(n.prochaineAction) d.prochaineAction = {texte:"Négociation : " + n.prochaineAction, date: d.prochaineAction?.date||""};
    S.editing=false; if(await saveOffer(d, "Négociation mise à jour", "04")) toast("Négociation enregistrée");
  }
  if(kind==="histo"){
    const o = S.offres.get(id); const h = readForm(f, {});
    if(!h.resume && !h.next) return toast("Ajoute un résumé");
    const d = clone(o); d.historique = [...(d.historique||[]), {id:uid("h"), date:h.date||today(), type:h.type, canal:h.canal, resume:h.resume, verifie: h.type==="message_envoye" ? !!h.verifie : true}];
    if(h.type==="message_envoye"){ d.candidature = Object.assign({}, d.candidature, {statut: d.candidature?.statut==="envoyee"||d.candidature?.statut==="en_attente" ? "en_attente" : "envoyee", premierContact: d.candidature?.premierContact || h.date, canal: h.canal || d.candidature?.canal, profilEnvoye:true}); }
    if(h.type==="reponse") d.candidature = Object.assign({}, d.candidature, {reponse: h.resume});
    if(h.type==="visite") d.candidature = Object.assign({}, d.candidature, {statut:"visite"});
    if(h.next) d.prochaineAction = {texte:h.next, date:h.nextDate||""};
    S.editing=false; if(await saveOffer(d, "Historique : " + h.type, "05")) toast("Ajouté à l'historique");
  }
  if(kind==="profil"){
    const p = readForm(f, S.profil||{});
    const act = f.querySelector("[data-pv-active]:checked"); if(act && p.presentations) p.presentations.forEach((v,i)=> v.actif = String(i)===act.dataset.pvActive);
    S.editing=false;
    try{ await S.db.doc("profil/main").set(Object.assign(p,{updatedAt:nowIso()})); await log("03","Profil candidat mis à jour"); toast("Profil enregistré"); }catch(err){ toast("Échec de l'enregistrement du profil"); }
  }
  if(kind==="settings"){
    const s = readForm(f, settings()); S.editing=false;
    try{ await S.db.doc("meta/settings").set(s); await log("07","Paramètres modifiés, classement recalculé"); toast("Paramètres enregistrés"); }catch(err){ toast("Échec de l'enregistrement"); }
  }
});
document.addEventListener("focusin", e=>{ if(e.target.closest("[data-form]")) S.editing = true; });
document.addEventListener("input", e=>{
  const el = e.target.closest("[data-filter]"); if(!el) return;
  S.filters[el.dataset.filter] = el.value;
  try{ localStorage.setItem("ar-filters", JSON.stringify(S.filters)); }catch(_){}
  clearTimeout(S._ft); S._ft = setTimeout(()=>render(true), el.tagName==="INPUT"?250:0);
});
document.addEventListener("change", async e=>{
  const el = e.target;
  if(el.matches("[data-act-change='candStatut']")){
    const o = S.offres.get(el.dataset.id); const d = clone(o);

    d.candidature = Object.assign({}, d.candidature, {statut: el.value}); await saveOffer(d, "Statut de candidature : " + CAND_LABEL[el.value], "03");

/* ===================== Actions ===================== */
const ACT = {
  more(){ openMore(); }, closeMore(){ $("#overlay").innerHTML=""; },
  open(t){ location.hash = "offre-" + t.dataset.id; },
  openCand(t){ S.tab[t.dataset.id]="candidature"; location.hash = "offre-" + t.dataset.id; },
  openNego(t){ S.tab[t.dataset.id]="negociation"; location.hash = "offre-" + t.dataset.id; },
  tab(t){ S.tab[t.dataset.id] = t.dataset.tab; S.editing=false; render(true); },
  async markSeen(t){ const d = clone(S.offres.get(t.dataset.id)); d.nouvelle=false; await saveOffer(d); },
  async genCand(t){
    const o = S.offres.get(t.dataset.id); const cs = contactState(o);
    const d = clone(o); const g = genCandidature(o, S.profil);
    d.candidature = Object.assign({statut:"a_preparer"}, d.candidature, {draft:g});
    if(["a_preparer",undefined].includes(o.candidature?.statut)) d.candidature.statut = "brouillon";
    if(!d.negociation) d.negociation = defaultNego(o);
    S.gen[o.id] = cs.any ? "Attention : un contact existe déjà dans l'historique. Ce texte sert de base, pas de nouvel envoi." : "Brouillon généré à partir de ton profil. Relis-le avant tout envoi.";
    await saveOffer(d, "Candidature générée", "03");
  },
  async genAll(){
    let n = 0;
    for(const o of S.offres.values()){
      if(o.doublonDe || o.candidature?.draft) continue;
      const sc = computeScore(o); if(!ACTIFS(sc.qualif)) continue;
      const d = clone(o); d.candidature = Object.assign({statut:"brouillon"}, d.candidature, {draft: genCandidature(o, S.profil)}); if((o.candidature?.statut||"a_preparer")==="a_preparer") d.candidature.statut="brouillon";
      if(!d.negociation) d.negociation = defaultNego(o);
      if(await saveOffer(d)) n++;
    }
    await log("03", n + " brouillon(s) de candidature générés", null, "ok"); toast(n + " brouillon(s) générés");
  },
  async refineCand(t){
    const o = S.offres.get(t.dataset.id);
    if(!S.sample){ S.gen[o.id] = "Claude n'est pas disponible dans cette vue : le modèle de base reste utilisable."; return render(true); }
    S.gen[o.id] = "Claude réécrit le mail…"; render(true);
    const p = S.profil||{}, sc = computeScore(o);
    const prompt = `Tu aides un professionnel de l'image à candidater pour louer un local. Réécris le mail ci-dessous pour qu'il soit humain, précis, sérieux et convaincant, sans formules administratives, 220 mots maximum.
Règles strictes : ne rien inventer (pas de chiffres, de clients, de contrats ou de structure juridique non mentionnés) ; les artistes cités sont des références professionnelles, pas des garants ; ne jamais dire qu'une micro-entreprise ou société existe ; ne promettre aucune audience ; ne pas proposer d'échange de prestations contre une baisse de loyer ; garder les questions utiles au propriétaire ; garder la signature.
Annonce : ${JSON.stringify({titre:o.titre, ville:o.ville, type:TYPES[o.type], contact:o.contact?.type, description:(o.description||"").slice(0,800), atouts:atouts(o), score:sc.total})}
Profil : ${JSON.stringify({nom:p.nom, metiers:p.metiers, portfolio:p.portfolio, references:p.references, bio:p.bio})}
Mail actuel :
${o.candidature?.draft?.sections?.mail||""}
Réponds uniquement en JSON : {"objet": string, "corps": string}`;
    try{
      const r = await S.sample.json(prompt, {modelTier:"default", cache:false});
      if(!r || !r.corps) throw {code:"invalid_json"};
      const d = clone(o); d.candidature.draft.sections.mail = `Objet : ${r.objet||o.candidature.draft.objet}\n\n${r.corps}`; d.candidature.draft.auteur = "Agent 03 + Claude"; d.candidature.draft.generatedAt = nowIso();
      S.gen[o.id] = "Mail affiné par Claude. Relis-le avant envoi.";
      await saveOffer(d, "Mail de candidature affiné avec Claude", "03");
    }catch(e){ S.gen[o.id] = ({not_granted:"Accès à Claude refusé pour cette page.", rate_limited:"Trop de demandes : réessaie plus tard.", sampling_disabled:"Claude n'est pas disponible pour ce compte."}[e.code]) || "Réécriture impossible pour l'instant. Le modèle de base reste disponible."; render(true); }
  },
  markSent(t){ S.tab[t.dataset.id]="historique"; render(true); setTimeout(()=>{ const s=$("#h-type"); if(s){ s.value="message_envoye"; $("#h-resume")?.focus(); } }, 30); toast("Renseigne l'envoi : canal, date, et coche « vérifié » si tu le vois dans tes envoyés"); },
  copySec(t){ const o=S.offres.get(t.dataset.id); copy(o.candidature?.draft?.sections?.[t.dataset.k]||"", t); },
  async merge(t){
    const a = clone(S.offres.get(t.dataset.id)), b = clone(S.offres.get(t.dataset.other));
    const urls = new Set((a.sources||[]).map(s=>normUrl(s.url)));
    a.sources = [...(a.sources||[]), ...(b.sources||[]).filter(s=>!urls.has(normUrl(s.url)))];
    a.historique = [...(a.historique||[]), ...(b.historique||[])];
    b.doublonDe = a.id; b.candidature = Object.assign({}, b.candidature, {statut: b.candidature?.statut||"a_preparer"});
    await saveOffer(a, "Fusion de doublon : sources de " + b.id + " rattachées", "01"); await saveOffer(b);
    toast("Fiches fusionnées");
  },
  async delOffer(t){
    if(t.dataset.confirm!=="1"){ t.dataset.confirm="1"; t.textContent="Confirmer la suppression"; return; }
    try{ await S.db.collection("offres").doc(t.dataset.id).delete(); await log("07","Dossier supprimé", t.dataset.id); location.hash="recherche"; }catch(e){ toast("Suppression impossible"); }
  },
  async newOffer(){
    const id = "o-" + Date.now().toString(36);
    const o = {id, ref:id.toUpperCase(), titre:"Nouvelle annonce", ville:"", type:"local_activite", styles:[], sources:[{site:"", url:"", ref:""}], dateVerif:today(), etatAnnonce:"a_reverifier", fiabilite:"faible", prive:{valeur:"inconnu",statut:"inconnu"}, surface:{statut:"inconnu"}, couts:{}, candidature:{statut:"a_preparer"}, historique:[], nouvelle:true, createdAt:nowIso()};
    if(await saveOffer(o, "Annonce ajoutée manuellement", "01")){ S.tab[id]="modifier"; location.hash = "offre-" + id; }
  },
  importJson(){
    $("#overlay").innerHTML = `<div class="scrim" data-act="closeMore"></div><div class="sheet" role="dialog" aria-label="Importer"><div class="ph"><h2>Importer des dossiers (JSON)</h2><button class="btn ghost" data-act="closeMore">Fermer</button></div>
    <p class="small muted">Colle un tableau JSON d'annonces (par exemple les dossiers de la veille J0). Les champs absents restent « inconnus » ; rien n'est supposé.</p>
    <textarea id="imp" style="min-height:180px" placeholder='[{"titre":"…","ville":"…","sources":[{"site":"…","url":"…"}],"surface":{"retenue":45,"statut":"declaratif"},"couts":{"loyerHT":{"v":600,"s":"declaratif"}},"dateVerif":"2026-11-11","etatAnnonce":"a_reverifier"}]'></textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="doImport">Importer</button></div></div>`;
  },
  async doImport(){
    let arr; try{ arr = JSON.parse($("#imp").value); if(!Array.isArray(arr)) arr=[arr]; }catch(e){ return toast("JSON invalide"); }
    let n=0;
    for(const x of arr){ const id = x.id || ("o-" + Date.now().toString(36) + n); const o = Object.assign({type:"autre", styles:[], sources:[], etatAnnonce:"a_reverifier", fiabilite:"faible", prive:{valeur:"inconnu",statut:"inconnu"}, surface:{statut:"inconnu"}, couts:{}, candidature:{statut:"a_preparer"}, historique:[], nouvelle:true, createdAt:nowIso()}, x, {id}); if(!o.titre) o.titre="Annonce importée"; if(await saveOffer(o)) n++; }
    await log("01", n + " dossier(s) importé(s)", null, "ok"); $("#overlay").innerHTML=""; toast(n + " dossier(s) importé(s)");
  },
  addPresentation(){ const p = clone(S.profil||{}); p.presentations = [...(p.presentations||[]), {nom:"Nouvelle version", texte:"", actif:false}]; S.db.doc("profil/main").set(p).then(()=>toast("Version ajoutée")); },
  async newCompte(){ const id = uid("c"); try{ await S.db.collection("comptes").doc(id).set({plateforme:"Nouvelle plateforme", statut:"a_creer", email:"", alertes:"aucune", action:"Renseigner la plateforme"}); toast("Ligne ajoutée au registre"); }catch(e){ toast("Ajout impossible"); } },
  runVeille(){ runVeille(); },
  toggleFilters(){ setTimeout(()=>{ S.filtersOpen = !!$("#filtersBox")?.open; }, 0); }
};
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]"); if(!t) return;
  const a = t.dataset.act; if(!ACT[a]) return;
  if(t.tagName==="BUTTON" || t.tagName==="TR" || t.tagName==="SUMMARY" && false || t.classList.contains("mini") || t.classList.contains("scrim")) e.preventDefault();
  ACT[a](t, e);
});

/* ===================== Veille (Agent 01 + 02) ===================== */
async function runVeille(){
  const V = S.veille; if(V.running) return;
  const stamp = () => new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const say = m => { V.log.push({t:stamp(), m}); render(true); };
  V.running = true; V.log = []; say("Démarrage de la veille.");
  if(!S.mcp){ say("Firecrawl n'est pas accessible depuis cette vue. Lance la veille depuis ta session Claude."); V.running=false; await log("01","Veille impossible : Firecrawl non accessible dans la page", null, "bloque", "Firecrawl"); return render(true); }
  const qs = settings().veille.requetes.slice(0,6);
  const results = [];
  for(const q of qs){
    try{
      const r = await S.mcp.callTool("Firecrawl","firecrawl_search",{query:q, limit:10, sources:["web"], domainTools:false, location:"France", objective:"Trouver des locaux privatifs de 30 à 60 m² à louer en Île-de-France pour un studio audiovisuel."}, {cache:false});
      const p = r.payload || {}; const web = p?.data?.web || p?.web || [];
      web.forEach(w=> results.push({url:w.url, title:w.title, description:(w.description||"").slice(0,700)}));
      say(`« ${q.slice(0,60)}… » : ${web.length} résultat(s).`);
    }catch(e){
      say(`Requête en échec (${e.code||"erreur"})${e.code==="not_in_manifest"?" : autorise Firecrawl pour cette page.":e.code==="needs_reauth"?" : reconnecte Firecrawl dans les connecteurs claude.ai.":""}`);
      if(["not_in_manifest","needs_reauth","server_not_connected","blocked_by_policy"].includes(e.code)) break;
    }
  }
  const known = new Set([...S.offres.values()].flatMap(o=>(o.sources||[]).map(s=>normUrl(s.url))));
  const fresh = []; const seen = new Set();
  for(const r of results){ const k = normUrl(r.url); if(!r.url || known.has(k) || seen.has(k)) continue; seen.add(k); fresh.push(r); }
  say(`${results.length} résultats, ${fresh.length} lien(s) jamais vus.`);
  if(!fresh.length){ await finishVeille(0, results.length); return; }
  if(!S.sample){ say("Claude n'est pas disponible pour qualifier les résultats : rien n'est ajouté."); V.running=false; return render(true); }
  say("Qualification des résultats par Claude (Agent 02)…");
  const prompt = `Voici des résultats de recherche web (titre, lien, extrait). Garde UNIQUEMENT les annonces individuelles de location d'un local (pas les pages de liste, pas les ventes, pas les événements, pas les logements) situées à Paris ou en Île-de-France, de 20 à 90 m² si la surface est connue.
Écarte les coworkings, postes de travail, ateliers partagés, tiers-lieux mutualisés et les locaux dont le loyer dépasse 800 € par mois.
Pour chacune, extrais uniquement ce que l'extrait dit explicitement. Ce qui n'est pas écrit vaut null. N'invente rien.
Réponds uniquement par un tableau JSON d'objets : {"url": string, "titre": string, "ville": string|null, "surface": number|null, "loyerMensuel": number|null, "loyerPrecision": "HT"|"TTC"|"CC"|"HC"|null, "type": "loft"|"atelier_artiste"|"garage"|"local_activite"|"atelier_artisanal"|"entrepot"|"commerce"|"local_pro"|"bureau"|"autre", "partage": true|false|null, "styles": string[] (parmi loft, industriel, verriere, mezzanine, garage, grande_hauteur, lumiere, rdc), "resume": string (1 phrase)}.
Résultats :
${JSON.stringify(fresh.slice(0,40))}`;
  let items = [];
  try{ items = await S.sample.json(prompt, {modelTier:"default", cache:false}); if(!Array.isArray(items)) items = []; }
  catch(e){ say("Qualification impossible (" + (e.code||"erreur") + "). Les liens ne sont pas ajoutés."); V.running=false; await log("02","Qualification des résultats de veille impossible", null, "erreur", "Claude"); return render(true); }
  let added = 0, skipped = 0;
  for(const it of items){
    if(!it || !it.url || known.has(normUrl(it.url))) continue;
    if(it.partage===true || (num(it.loyerMensuel)!=null && num(it.loyerMensuel)>settings().budget.plafond)){ skipped++; continue; }
    const site = (()=>{ try{ return new URL(it.url).hostname.replace(/^www\./,""); }catch(e){ return ""; } })();
    const id = "o-" + Date.now().toString(36) + added;
    const o = {id, ref:id.toUpperCase(), titre: it.titre || "Annonce détectée", ville: it.ville||"", type: TYPES[it.type]?it.type:"autre", styles: (it.styles||[]).filter(s=>STYLES[s]), stylesStatut:"declaratif",
      sources:[{site, url:it.url, ref:"", datePublication:null}], dateVerif: today(), verification:{niveau:"consultee", date:today()}, etatAnnonce:"a_reverifier", fiabilite:"faible", contact:{formulaire:it.url},
      prive: it.partage===true ? {valeur:"non", statut:"declaratif"} : {valeur:"inconnu", statut:"inconnu"},
      surface: it.surface ? {retenue:it.surface, min:it.surface, max:it.surface, statut:"declaratif"} : {statut:"inconnu"},
      couts: it.loyerMensuel ? {loyerHT:{v:it.loyerMensuel, s:"declaratif"}, tva: it.loyerPrecision==="TTC" ? {v:0, s:"declaratif"} : {v:null, s:"inconnu"}, charges: it.loyerPrecision==="CC" ? {v:0, s:"inclus"} : {v:null, s:"inconnu"}} : {},
      description: it.resume || "", candidature:{statut:"a_preparer"}, historique:[], nouvelle:true, createdAt: nowIso(), detectePar:"veille" };
    o.candidature = {statut:"brouillon", draft: genCandidature(o, S.profil)}; o.negociation = defaultNego(o);
    if(await saveOffer(o)) { added++; known.add(normUrl(it.url)); }
  }
  if(skipped) S.veille.log.push({t:new Date().toLocaleTimeString("fr-FR"), m:`${skipped} résultat(s) ignoré(s) : partagés ou au-dessus de ${eur(settings().budget.plafond)}.`});
  await finishVeille(added, results.length);
}
async function finishVeille(added, total){
  S.veille.log.push({t:new Date().toLocaleTimeString("fr-FR"), m:`Terminé : ${added} nouvelle(s) annonce(s), chacune avec son dossier et son brouillon de candidature. À vérifier à la source.`});
  try{ await S.db.doc("meta/status").set(Object.assign({}, S.status||{}, {derniereRecherche: nowIso(), derniereRechercheResultats: total, derniereRechercheAjouts: added, derniereRechercheSource:"application (Firecrawl)"})); }catch(e){}
  await log("01", `Veille depuis l'application : ${total} résultats, ${added} annonce(s) ajoutée(s)`, null, "ok", "Firecrawl");
  S.veille.running = false; render(true);
}

/* ===================== Routage & rendu ===================== */
function route(){
  const h = (location.hash||"").replace(/^#/,"");
  if(h.startsWith("offre-")){ S.view="offre"; S.param=h.slice(6); }
  else { S.view = PAGES.some(p=>p.id===h) ? h : "dashboard"; S.param=null; }
  S.editing=false; $("#overlay").innerHTML=""; render(true); window.scrollTo(0,0);
}
function render(force){
  if(S.editing && !force){ S.pending = true; return; }
  S.pending = false;
  renderNav();
  if(!S.ready.offres){ $("#main").innerHTML = `<div class="wrap"><div class="empty">${S.offline?"La base n'est pas joignable pour l'instant. Les dossiers s'afficheront dès qu'elle répond.":"Chargement des dossiers…"}</div></div>`; return; }
  const V = {dashboard:viewDashboard, recherche:viewRecherche, dossiers:viewDossiers, candidatures:viewCandidatures, profil:viewProfil, negociation:viewNegociation, comptes:viewComptes, journal:viewJournal, parametres:viewParametres};
  const active = document.activeElement?.id; const pos = document.activeElement?.selectionStart;
  let html;
  try{ html = S.view==="offre" ? viewOffre(S.param) : (V[S.view]||viewDashboard)(); }
  catch(err){ console.error(err); html = `<div class="note bad">Erreur d'affichage : ${esc(err.message)}</div>`; }
  $("#main").innerHTML = `<div class="wrap">${html}</div>`;
  if(active){ const el = document.getElementById(active); if(el && el.matches("[data-filter]")){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(_){} } }
}
window.addEventListener("hashchange", route);

/* ===================== Démarrage ===================== */
async function start(){
  try{ const f = JSON.parse(localStorage.getItem("ar-filters")||"null"); if(f) Object.assign(S.filters, f); }catch(_){}
  route();
  const C = window.claude;
  if(!C || !C.use){ S.offline = true; S.ready.offres = false; render(true); return; }
  const [db, user, sample, mcp] = await Promise.all([C.use("db"), C.use("user").catch(()=>null), C.use("sample").catch(()=>null), C.use("mcp").catch(()=>null)]);
  S.db = db; S.user = user; S.sample = sample; S.mcp = mcp;
  if(!db){ S.offline = true; render(true); return; }
  const timer = setTimeout(()=>{ if(!S.ready.offres){ S.offline = true; render(true); } }, 10000);
  db.collection("offres").onSnapshot(snap=>{ S.offres = new Map(snap.docs.map(d=>[d.id, Object.assign({id:d.id}, d.data())])); S.ready.offres = true; if(!snap.metadata.fromCache){ clearTimeout(timer); S.offline=false; } render(); }, err=>{ clearTimeout(timer); S.offline = true; S.ready.offres = true; render(true); });
  db.doc("profil/main").onSnapshot(s=>{ S.profil = s.exists ? s.data() : null; render(); }, ()=>{});
  db.doc("meta/settings").onSnapshot(s=>{ S.settings = s.exists ? s.data() : null; render(); }, ()=>{});
  db.doc("meta/status").onSnapshot(s=>{ S.status = s.exists ? s.data() : null; render(); }, ()=>{});
  db.collection("comptes").onSnapshot(s=>{ S.comptes = s.docs.map(d=>Object.assign({id:d.id}, d.data())); render(); }, ()=>{});
  db.collection("connecteurs").onSnapshot(s=>{ S.connecteurs = s.docs.map(d=>Object.assign({id:d.id}, d.data())); render(); }, ()=>{});
  db.collection("journal").orderBy("date","desc").limit(300).onSnapshot(s=>{ S.journal = s.docs.map(d=>Object.assign({id:d.id}, d.data())); render(); }, ()=>{});
}
start();
</script>
